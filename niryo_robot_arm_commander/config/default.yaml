joint_names: ['joint_1', 'joint_2', 'joint_3', 'joint_4', 'joint_5', 'joint_6']

# - MoveIt! params
reference_frame: world
move_group_commander_name: arm
joint_controller_name: "/niryo_robot_follow_joint_trajectory_controller"

# Planning settings
allow_replanning: true
goal_joint_tolerance: 0.0001
goal_position_tolerance: 0.0001
goal_orientation_tolerance: 0.001
display_trajectories: False

trajectory_minimum_timeout : 3.0
compute_plan_max_tries : 3

# Linear trajectories computation
eef_step: 0.02

# - Other params
# "Is Active" topic's publish rate
active_publish_rate_sec: 0.1
command_still_active_max_tries : 3

# - Trajectory Acquisition Param
trajectory_frequency: 7

# - Trajectory Optimization Params
# Maximum number of retries for trajectory optimization.
# A limit of 24 retries, combined with the proximity step, ensures a maximum 
# cumulative filtering of ~0.036 rad (~2 deg). This prevents excessive point 
# removal that would otherwise degrade the intended geometric shape of the trajectory.
max_optimization_retries: 24
# Proximity threshold step for trajectory optimization (in radians) (this is the step of the motors)
proximity_threshold_step: 0.0015